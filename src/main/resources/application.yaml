spring:
  application:
    name: example-spring-integration
  kafka:
    # bootstrap-servers is supplied by the docker compose service connection (compose.yaml)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: manual
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  kafka:
    topics:
      - example-orders
      - example-payments
      - example-notifications
    # Which of these an instance consumes is decided by the slot it claims (table KAFKA_CONSUMER_SLOT).
    partitions: 15
    # Consumer threads per topic on each instance that consumes it (used by the @KafkaListener of that topic).
    concurrency:
      example-orders: 4
      example-payments: 4
      example-notifications: 4
    messages-per-topic: 10
