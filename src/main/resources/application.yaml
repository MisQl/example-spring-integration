spring:
  application:
    name: example-spring-integration
  kafka:
    # bootstrap-servers is supplied by the docker compose service connection (compose.yaml)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  kafka:
    topics:
      - example-orders
      - example-payments
      - example-notifications
    # Which of these an instance consumes is decided by the slot it claims (table KAFKA_CONSUMER_SLOT).
    partitions: 15
    messages-per-topic: 10
